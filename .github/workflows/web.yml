name: Web site

on:
  push:
    branches: [feature/flutter_migration]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *' # nightly, so the site catches up with the sheets

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # schedule / workflow_dispatch run from the default branch (master);
      # always build the live branch the app reads its config from.
      - uses: actions/checkout@v4
        with:
          ref: feature/flutter_migration

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true

      - name: Empty env file (the web build must carry no keys)
        run: echo '{}' > assets/.env.json

      - run: flutter pub get

      - name: Snapshot remote seasons from Google Sheets
        run: dart run tool/prefetch_seasons.dart
        env:
          SHEETS_API_KEY: ${{ secrets.SHEETS_API_KEY }}
          REMOTE_CONFIG_URL: https://raw.githubusercontent.com/Seezov/FamilyMafiaApp/feature/flutter_migration/remote_config.json

      - run: flutter test

      - name: Export site data
        run: flutter test tool/export_site_data_test.dart

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json

      # `npm run build` ends with scripts/check-dist.mjs: fails on an `AIza`
      # key, a broken internal link, or a player without a page.
      - name: Build site
        working-directory: site
        run: |
          npm ci
          npm run check
          npm test
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
