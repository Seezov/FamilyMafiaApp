name: Web site

on:
  push:
    branches: [feature/flutter_migration]
  workflow_dispatch:
    inputs:
      federations:
        description: Fetch federation games now (otherwise only the nightly run does)
        type: boolean
        default: false
  schedule:
    - cron: '0 3 * * *' # nightly, so the site catches up with the sheets

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # schedule / workflow_dispatch run from the default branch (master);
      # always build the live branch the app reads its config from.
      - uses: actions/checkout@v4
        with:
          ref: feature/flutter_migration

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true

      - name: Empty env file (the web build must carry no keys)
        run: echo '{}' > assets/.env.json

      - run: flutter pub get

      - name: Snapshot remote seasons from Google Sheets
        run: dart run tool/prefetch_seasons.dart
        env:
          SHEETS_API_KEY: ${{ secrets.SHEETS_API_KEY }}
          REMOTE_CONFIG_URL: https://raw.githubusercontent.com/Seezov/FamilyMafiaApp/feature/flutter_migration/remote_config.json

      - run: flutter test

      - name: Export site data
        run: flutter test tool/export_site_data_test.dart

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json

      # Federation tournament games: only the nightly run (or a manual run with `federations`) fetches; it saves
      # the cache on master, which every branch can restore. Other builds reuse the last cache.
      - name: Restore federation games cache
        uses: actions/cache/restore@v4
        with:
          path: site/.fedgames
          key: fedgames-${{ github.run_id }}
          restore-keys: fedgames-

      # Never blocks the deploy: a stuck or broken federation site leaves the last cache in place.
      - name: Fetch federation games
        if: github.event_name == 'schedule' || inputs.federations
        timeout-minutes: 15
        continue-on-error: true
        working-directory: site
        run: node scripts/fetch-federation-games.ts

      - name: Save federation games cache
        if: always() && (github.event_name == 'schedule' || inputs.federations)
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: site/.fedgames
          key: fedgames-${{ github.run_id }}

      # `npm run build` ends with scripts/check-dist.mjs: fails on an `AIza`
      # key, a broken internal link, or a player without a page.
      - name: Build site
        working-directory: site
        run: |
          npm ci
          npm run check
          npm test
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Not actions/deploy-pages: it names the deployment after the commit SHA, and
      # Pages treats a second deployment of the same SHA as already done, so the
      # nightly / games-watch rebuilds of an unchanged commit never went live
      # (the site was stuck on 2026-10-28 for a month). Each run deploys under its own commit SHA instead.
      - id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({ owner, repo, run_id: context.runId });
            const artifact = data.artifacts.find((a) => a.name === 'github-pages');
            if (!artifact) throw new Error('github-pages artifact not found');
            // Pages only accepts a real commit SHA as the build version, so each run makes
            // its own commit object (same tree, parent = this commit, on no branch).
            const { data: head } = await github.rest.git.getCommit({ owner, repo, commit_sha: context.sha });
            const { data: commit } = await github.rest.git.createCommit({
              owner, repo,
              message: `Pages build ${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}`,
              tree: head.tree.sha,
              parents: [context.sha],
            });
            const version = commit.sha;
            const created = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner, repo,
              artifact_id: artifact.id,
              pages_build_version: version,
              oidc_token: await core.getIDToken(),
            });
            core.info(`Created Pages deployment ${version}`);
            core.setOutput('page_url', created.data.page_url);
            for (let i = 0; i < 120; i++) {
              await new Promise((r) => setTimeout(r, 5000));
              const { data: s } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{id}', { owner, repo, id: version });
              core.info(`status: ${s.status}`);
              if (s.status === 'succeed') return;
              if (['deployment_failed', 'deployment_lost', 'deployment_content_failed', 'deployment_cancelled', 'deployment_attempt_error'].includes(s.status)) {
                throw new Error(`Pages deployment ${s.status}`);
              }
            }
            throw new Error('Pages deployment timed out');
